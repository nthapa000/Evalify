name: Backend Tests

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
  pull_request:
    branches: ["main"]
    paths:
      - "backend/**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        # Tests use an in-memory MongoDB (tests/conftest.py); no database service needed
        env:
          TEACHER_JWT_SECRET: ci_teacher_secret_minimum_32_characters
          STUDENT_JWT_SECRET: ci_student_secret_minimum_32_characters
        run: pytest tests/ -v --tb=short
